version: '3.9'

# Ambiente de Homologação e Testes Locais Isolados (Zero-Knowledge Sync)
# Nenhum segredo fixo no repositório: todas as credenciais são injetadas via variáveis de ambiente.
services:
  postgres-homolog:
    image: postgres:16-alpine
    container_name: donutvault-postgres-homolog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-donutvault_homolog}
      POSTGRES_USER: ${SQL_ADMIN_USER:-donutvault_admin}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD:?Defina SQL_ADMIN_PASSWORD no ambiente}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - donutvault_pgdata:/var/lib/postgresql/data

  donutvault-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: donutvault-homolog-server
    depends_on:
      postgres-homolog:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000
      SQL_HOST: postgres-homolog
      SQL_DB_NAME: ${SQL_DB_NAME:-donutvault_homolog}
      SQL_USER: ${SQL_USER:-donutvault_app}
      SQL_PASSWORD: ${SQL_PASSWORD:?Defina SQL_PASSWORD no ambiente}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  donutvault_pgdata:
