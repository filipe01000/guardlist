services:
  - type: web
    name: guardlist
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Defina os valores no painel do Render (sync: false = não ficam no repositório).
      # Usuários do login, gerados com `npm run user:add -- <usuario>`.
      - key: APP_USERS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: GREYNOISE_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
