services:
  - type: web
    name: guardlist
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run build:cofre
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Node 24: exigido pelo cofre (DonutVault, em /cofre).
      - key: NODE_VERSION
        value: "24"
      # Política de segurança de produção do cofre.
      - key: NODE_ENV
        value: production
      # Defina os valores no painel do Render (sync: false = não ficam no repositório).
      # Banco Postgres da equipe (Neon): cole a connection string completa.
      - key: DATABASE_URL
        sync: false
      # Primeiro administrador: usuário "admin" com esta senha provisória (trocada no 1º acesso).
      # Opcional se APP_USERS já tiver usuários; ambos só são lidos com o banco vazio.
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: APP_USERS
        sync: false
      # Banco do cofre (/cofre): Neon próprio, nunca o mesmo da equipe.
      - key: DONUTVAULT_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: GREYNOISE_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      # E-mail para o relatório mensal e o backup diário (veja .env.example).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REPORT_EMAILS
        sync: false
      - key: BACKUP_EMAILS
        sync: false
