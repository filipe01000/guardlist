# Bancos Postgres para desenvolvimento e testes locais. O app roda fora do Docker (npm run dev).
# Uso: docker compose up -d
# As portas ficam presas a 127.0.0.1; nada fica exposto na rede.
services:
  # Banco do servidor local (npm run dev). Os dados ficam no volume donutvault_pgdata.
  postgres-dev:
    image: postgres:16-alpine
    container_name: donutvault-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: donutvault_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:-donutvault}
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d donutvault_local']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - donutvault_pgdata:/var/lib/postgresql/data

  # Banco só para npm test. Fica em memória: some quando o contêiner para.
  postgres-test:
    image: postgres:16-alpine
    container_name: donutvault-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: dvtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dvtest
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dvtest']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  donutvault_pgdata:
