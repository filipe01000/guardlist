<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" role="img" aria-label="GuardList">
  <defs>
    <linearGradient id="gl-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d90bb"/>
      <stop offset="1" stop-color="#4a6d98"/>
    </linearGradient>
    <linearGradient id="gl-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58799f"/>
      <stop offset="1" stop-color="#3d5e86"/>
    </linearGradient>
    <linearGradient id="gl-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eeaff"/>
      <stop offset="1" stop-color="#14c8ec"/>
    </linearGradient>
    <filter id="gl-glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Folhas do escudo (portão), separadas pela fenda central -->
  <path d="M310 0 L0 140 L0 520 C40 612 150 690 310 740 Z" fill="url(#gl-left)"/>
  <path d="M330 0 L640 140 L640 520 C600 612 490 690 330 740 Z" fill="url(#gl-right)"/>

  <!-- Chanfro interno -->
  <path d="M288 46 L40 158 L40 508 C74 584 166 652 288 694" fill="none" stroke="#9cbde3" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round"/>
  <path d="M352 46 L600 158 L600 508 C566 584 474 652 352 694" fill="none" stroke="#88aad2" stroke-opacity="0.45" stroke-width="5" stroke-linejoin="round"/>

  <!-- Rebites -->
  <g fill="#a9c8ec" fill-opacity="0.8">
    <circle cx="282" cy="34" r="9"/>
    <circle cx="22" cy="152" r="9"/>
    <circle cx="22" cy="505" r="9"/>
    <circle cx="282" cy="708" r="9"/>
    <circle cx="358" cy="34" r="9"/>
    <circle cx="618" cy="152" r="9"/>
    <circle cx="618" cy="505" r="9"/>
    <circle cx="358" cy="708" r="9"/>
  </g>

  <!-- Painel central com a lista -->
  <rect x="186" y="266" width="268" height="208" rx="14" fill="#08111f" stroke="#1d2d48" stroke-width="3"/>
  <g filter="url(#gl-glow)" fill="#22d3ee" opacity="0.75">
    <rect x="220" y="298" width="200" height="36" rx="5"/>
    <rect x="220" y="352" width="200" height="36" rx="5"/>
    <rect x="220" y="406" width="200" height="36" rx="5"/>
  </g>
  <g fill="url(#gl-bar)">
    <rect x="220" y="298" width="200" height="36" rx="5"/>
    <rect x="220" y="352" width="200" height="36" rx="5"/>
    <rect x="220" y="406" width="200" height="36" rx="5"/>
  </g>
</svg>
